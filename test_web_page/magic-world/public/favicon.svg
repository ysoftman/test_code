<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#0b0b2b"/>
  <!-- 4-point star tip -->
  <rect x="7" y="1" width="2" height="7" fill="#ffd166"/>
  <rect x="4" y="3" width="8" height="3" fill="#ffd166"/>
  <rect x="8" y="2" width="1" height="1" fill="#fff3c4"/>
  <!-- wand handle -->
  <rect x="7" y="8" width="2" height="1" fill="#c98a2e"/>
  <rect x="7" y="9" width="2" height="3" fill="#8b5a2b"/>
  <rect x="6" y="12" width="3" height="1" fill="#8b5a2b"/>
  <rect x="5" y="13" width="4" height="1" fill="#8b5a2b"/>
  <rect x="4" y="14" width="5" height="1" fill="#8b5a2b"/>
  <!-- sparkles -->
  <rect x="13" y="1" width="1" height="1" fill="#8ecbff"/>
  <rect x="2" y="7" width="1" height="1" fill="#8ecbff"/>
</svg>
