name: Deploy test_pages to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "test_pages/**"
      - "MachineLearning/*.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: test_pages/css-framework-comparison
        run: bun install

      - name: Build all framework apps
        working-directory: test_pages/css-framework-comparison
        run: bun run build:all

      - name: Install vue-sample dependencies
        working-directory: test_pages/vue-sample
        run: bun install

      - name: Build vue-sample
        working-directory: test_pages/vue-sample
        run: bun run build

      - name: Install react-sample dependencies
        working-directory: test_pages/react-sample
        run: bun install

      - name: Build react-sample
        working-directory: test_pages/react-sample
        run: bun run build

      - name: Install particle dependencies
        working-directory: test_pages/particle
        run: bun install

      - name: Build particle
        working-directory: test_pages/particle
        run: bun run build

      - name: Install tsparticles dependencies
        working-directory: test_pages/tsparticles
        run: bun install

      - name: Build tsparticles
        working-directory: test_pages/tsparticles
        run: bun run build

      - name: Install ml-docs dependencies
        working-directory: test_pages/ml-docs
        run: bun install

      - name: Build ml-docs
        working-directory: test_pages/ml-docs
        run: bun run build

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-stable-web

      # 템플릿 tpz(1.2GB) 중 web_nothreads_release.zip 만 남긴다 (캐시 히트 시 생략)
      - name: Install Godot and web export template
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          URL=https://github.com/godotengine/godot/releases/download/4.7.2-stable
          TPL=~/.local/share/godot/export_templates/4.7.2.stable
          mkdir -p ~/godot "$TPL"
          curl -sSL -o /tmp/godot.zip "$URL/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v4.7.2-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/tpl.tpz "$URL/Godot_v4.7.2-stable_export_templates.tpz"
          unzip -q -j /tmp/tpl.tpz templates/web_nothreads_release.zip -d "$TPL"
          rm /tmp/godot.zip /tmp/tpl.tpz

      - name: Export godot-game (Web)
        working-directory: test_pages/godot-game
        run: |
          mkdir -p build
          ~/godot/godot --headless --import
          ~/godot/godot --headless --export-release Web build/index.html

      - name: Build design-skill-comparison apps
        run: |
          set -euo pipefail
          for dir in test_pages/design-skill-comparison/*/; do
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && bun install && bun run build)
            fi
          done

      - name: Assemble _site
        run: |
          set -euo pipefail
          SRC=test_pages
          OUT=_site

          # 1) static landing pages
          mkdir -p "$OUT/css-framework-comparison"
          cp "$SRC/index.html" "$OUT/index.html"
          cp "$SRC/css-framework-comparison/index.html" "$OUT/css-framework-comparison/index.html"

          # 2) each framework app that produced a dist
          for dir in "$SRC"/css-framework-comparison/*/; do
            app=$(basename "$dir")
            if [ -d "$dir/dist" ]; then
              echo "include built app: $app"
              mkdir -p "$OUT/css-framework-comparison/$app"
              cp -r "$dir/dist/." "$OUT/css-framework-comparison/$app/"
            fi
          done

          if [ -d "$SRC/vue-sample/dist" ]; then
            echo "include built app: vue-sample"
            mkdir -p "$OUT/vue-sample"
            cp -r "$SRC/vue-sample/dist/." "$OUT/vue-sample/"
            # SPA(history mode) 새로고침/딥링크 대비 404 fallback
            cp "$OUT/vue-sample/index.html" "$OUT/vue-sample/404.html"
          fi

          if [ -d "$SRC/react-sample/dist" ]; then
            echo "include built app: react-sample"
            mkdir -p "$OUT/react-sample"
            cp -r "$SRC/react-sample/dist/." "$OUT/react-sample/"
          fi

          if [ -d "$SRC/particle/dist" ]; then
            echo "include built app: particle"
            mkdir -p "$OUT/particle"
            cp -r "$SRC/particle/dist/." "$OUT/particle/"
          fi

          if [ -d "$SRC/tsparticles/dist" ]; then
            echo "include built app: tsparticles"
            mkdir -p "$OUT/tsparticles"
            cp -r "$SRC/tsparticles/dist/." "$OUT/tsparticles/"
          fi

          if [ -d "$SRC/ml-docs/.vitepress/dist" ]; then
            echo "include built app: ml-docs"
            mkdir -p "$OUT/ml-docs"
            cp -r "$SRC/ml-docs/.vitepress/dist/." "$OUT/ml-docs/"
          fi

          if [ -f "$SRC/godot-game/build/index.html" ]; then
            echo "include built app: godot-game"
            mkdir -p "$OUT/godot-game"
            cp -r "$SRC/godot-game/build/." "$OUT/godot-game/"
          fi

          # common: 비교·벤치마크 문서 공용 스타일시트 (doc.css)
          cp -r "$SRC/common" "$OUT/"

          # lang-history: 정적 페이지 묶음 (index + 언어별 html + 공통 css/js)
          mkdir -p "$OUT/lang-history"
          cp -r "$SRC/lang-history/." "$OUT/lang-history/"

          # bun-benchmark: benchmark pages and their shared assets
          cp -r "$SRC/bun-benchmark" "$OUT/"

          # design-skill-comparison: 랜딩 + 스킬별 페이지 (package.json 있으면 dist, 없으면 폴더 그대로)
          mkdir -p "$OUT/design-skill-comparison"
          cp "$SRC/design-skill-comparison/index.html" "$OUT/design-skill-comparison/"
          for dir in "$SRC"/design-skill-comparison/*/; do
            app=$(basename "$dir")
            mkdir -p "$OUT/design-skill-comparison/$app"
            if [ -f "$dir/package.json" ]; then
              cp -r "$dir/dist/." "$OUT/design-skill-comparison/$app/"
            else
              cp -r "$dir/." "$OUT/design-skill-comparison/$app/"
            fi
          done

          # python-toolchain: 단일 정적 페이지
          mkdir -p "$OUT/python-toolchain"
          cp "$SRC/python-toolchain/index.html" "$OUT/python-toolchain/"

          # animejs: 단일 정적 페이지 (CDN ESM)
          mkdir -p "$OUT/animejs"
          cp "$SRC/animejs/index.html" "$OUT/animejs/"

          # server-framework-comparison: 단일 정적 페이지 + 실측 결과 JSON
          mkdir -p "$OUT/server-framework-comparison"
          cp "$SRC/server-framework-comparison/index.html" "$OUT/server-framework-comparison/"
          cp "$SRC/server-framework-comparison/results.json" "$OUT/server-framework-comparison/"

          # inkworks: 런처 + inkworks-skill kit 원본 사본 (빌드 없음, three.js vendored)
          cp -r "$SRC/inkworks" "$OUT/"

          # 모든 페이지 우하단에 빌드/배포 시간 배지 삽입
          BUILT_AT=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')
          export BADGE="<div style=\"position:fixed;right:8px;bottom:8px;z-index:2147483647;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font:12px/1.6 system-ui,sans-serif;pointer-events:none\">deployed ${BUILT_AT}</div>"
          find "$OUT" -name '*.html' -exec perl -0777 -pi -e 's#</body>#$ENV{BADGE}</body>#i' {} +

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
