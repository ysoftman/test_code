# Configuration for Vector's Ingress.
ingress:
  # ingress.enabled -- If true, create and use an Ingress resource.
  enabled: true
  # ingress.className -- Specify the [ingressClassName](https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#specifying-the-class-of-an-ingress),
  # requires Kubernetes >= 1.18
  # colima k3s 기본 내장 traefik ingress controller 사용
  className: "traefik"
  # ingress.annotations -- Set annotations on the Ingress.
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # ingress.hosts -- Configure the hosts and paths for the Ingress.
  hosts:
   - host: vector.ysoftman
     paths:
       - path: /
         pathType: ImplementationSpecific
         # Specify the port name or number on the Service
         # Using name requires Kubernetes >=1.19
         port:
           number: 8686
  # ingress.tls -- Configure TLS for the Ingress.
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# role -- [Role](https://vector.dev/docs/setup/deployment/roles/) for this Vector instance, valid options are:
# "Agent", "Aggregator", and "Stateless-Aggregator".
# Each role is created with the following workloads:
# Agent = DaemonSet
# Aggregator = StatefulSet
# Stateless-Aggregator = Deployment
role: "Agent"

# prometheus chart 의 kubernetes-pods job 이 이 annotation 을 보고 vector 의 prometheus_exporter 를 scrape 한다.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9598"
  prometheus.io/path: "/metrics"

customConfig:
  data_dir: /vector-data-dir
  api:
    enabled: true
    address: 0.0.0.0:8686
  sources:
    # Pod의 File Log를 읽어옵니다.
    # 참고: https://vector.dev/docs/reference/configuration/sources/kubernetes_logs/
    container_logs:
      type: "kubernetes_logs"
      glob_minimum_cooldown_ms: 8000
      max_line_bytes: 204800
    # vector 자체 처리량 메트릭(vector_component_received_events_total 등)
    # 참고: https://vector.dev/docs/reference/configuration/sources/internal_metrics/
    internal_metrics:
      type: "internal_metrics"
  transforms:
    # 로그 데이터를 재매핑(Remap)하는 Transform
    remap_log_fields:
      type: "remap"
      inputs:
        - "container_logs" # 위에서 정의한 Source의 출력
      source: |
        # ⚠️ Vector Remap Language (VRL) 사용
        # 원본 로그 데이터의 필드를 간결하게 재구성합니다.

        # 1. 로그 레벨(level) 필드가 없으면 'info'로 기본 설정합니다.
        .level = if !exists(.level) { "info" } else { .level }

        # 2. 타임스탬프를 ISO 8601 형식으로 변환하여 새 필드에 저장합니다.
        .simple_time = format_timestamp!(.timestamp, format: "iso8601")

        # 3. 원본 로그 메시지에서 불필요한 공백/개행을 제거합니다.
        .simple_message = strip_whitespace!(.message)

        # 4. 최종적으로 출력할 필드만 남깁니다. (선택 사항: . = {})
        # . = {} # 모든 필드를 제거하고 아래 필드만 다시 추가할 경우 사용

        # 5. 최종 메시지를 생성합니다.
        level_str = to_string(.level) ?? "UNKNOWN"
        level_up = upcase(level_str)

        .final_message, _ = "[ " + .simple_time + " | " + level_up + " | " + .kubernetes.pod_name + " ] " + .simple_message

    # 로그 한 줄당 counter 를 1 올려 ysoftman_log_lines_total{namespace,pod,level} 메트릭으로 바꾼다.
    # 참고: https://vector.dev/docs/reference/configuration/transforms/log_to_metric/
    log_lines_metric:
      type: "log_to_metric"
      inputs:
        - "remap_log_fields"
      metrics:
        - type: "counter"
          field: "message"
          name: "log_lines_total"
          namespace: "ysoftman"
          increment_by_value: false
          # chart 가 customConfig 를 helm tpl 로 한 번 더 렌더링하므로 vector 템플릿({{ }})은 이스케이프한다.
          tags:
            namespace: '{{ "{{ kubernetes.pod_namespace }}" }}'
            pod: '{{ "{{ kubernetes.pod_name }}" }}'
            level: '{{ "{{ level }}" }}'

  sinks:
    # 표준 출력(stdout)으로 데이터를 내보내는 Sink
    stdout_sink:
      type: "console"
      inputs:
        - "remap_log_fields" # Remap Transform의 출력
      encoding:
        # 메시지를 한 줄의 텍스트로 깔끔하게 출력하도록 설정
        codec: "text"
        # 출력할 메시지 필드를 지정합니다.
        field: "final_message"

    # 메트릭을 :9598/metrics 로 노출한다(prometheus 가 scrape).
    # 참고: https://vector.dev/docs/reference/configuration/sinks/prometheus_exporter/
    prometheus_sink:
      type: "prometheus_exporter"
      inputs:
        - "log_lines_metric"
        - "internal_metrics"
      address: "0.0.0.0:9598"

    # 컨테이너 로그 원본을 loki 로 보낸다(grafana Explore 에서 LogQL 로 조회).
    # loki label 은 카디널리티를 줄이기 위해 namespace/pod/container 만 쓴다.
    # 참고: https://vector.dev/docs/reference/configuration/sinks/loki/
    loki_sink:
      type: "loki"
      inputs:
        - "container_logs"
      endpoint: "http://loki.loki.svc.cluster.local:3100"
      encoding:
        codec: "text"
      labels:
        namespace: '{{ "{{ kubernetes.pod_namespace }}" }}'
        pod: '{{ "{{ kubernetes.pod_name }}" }}'
        container: '{{ "{{ kubernetes.container_name }}" }}'
