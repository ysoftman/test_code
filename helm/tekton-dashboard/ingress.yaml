apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tekton-dashboard
  namespace: tekton-pipelines
spec:
  # colima k3s 기본 내장 traefik ingress controller 사용
  ingressClassName: traefik
  rules:
    - host: tekton-dashboard.ysoftman
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: tekton-dashboard
                port:
                  number: 9097
