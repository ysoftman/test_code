expose:
  type: ingress
  tls:
    # certSource: auto 는 렌더링마다 인증서를 새로 만들어 argocd 에서 항상 OutOfSync 가 되고,
    # none 은 chart 1.18.1 에서 harbor-core 의 ca-download 볼륨 secretName 이 비어 pod 스펙이 깨진다.
    # 그래서 harbor 의 tls 는 끄고, 아래 traefik annotation(websecure + router.tls)으로 traefik 기본 인증서를 써서 https 를 처리한다.
    enabled: false
    certSource: auto
    auto:
      commonName: ""
    secret:
      secretName: ""
  ingress:
    hosts:
      core: harbor.ysoftman
    controller: default
    kubeVersionOverride: ""
    # colima k3s 는 traefik ingress controller 가 기본 내장되어 있다.
    className: "traefik"
    annotations:
      # https(websecure) entrypoint 로만 라우팅 (http 접근시 tls 필요)
      # nginx 의 ssl-redirect 대응, proxy-body-size 는 traefik 기본 무제한이라 불필요
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    labels: {}

externalURL: https://core.harbor.domain

persistence:
  enabled: true
  resourcePolicy: "keep"
  persistentVolumeClaim:
    registry:
      # Use the existing PVC which must be created manually before bound,
      # and specify the "subPath" if the PVC is shared with other components
      existingClaim: ""
      # Specify the "storageClass" used to provision the volume. Or the default
      # StorageClass will be used (the default).
      # Set it to "-" to disable dynamic provisioning
      storageClass: ""
      subPath: ""
      accessMode: ReadWriteOnce
      size: 5Gi
      annotations: {}
    jobservice:
      jobLog:
        existingClaim: ""
        storageClass: ""
        subPath: ""
        accessMode: ReadWriteOnce
        size: 1Gi
        annotations: {}
    # If external database is used, the following settings for database will
    # be ignored
    database:
      existingClaim: ""
      storageClass: ""
      subPath: ""
      accessMode: ReadWriteOnce
      size: 1Gi
      annotations: {}
  # Define which storage backend is used for registry to store
  # images and charts. Refer to
  # https://github.com/distribution/distribution/blob/release/2.8/docs/configuration.md#storage
  # for the detail.
  imageChartStorage:
    # Specify whether to disable `redirect` for images and chart storage, for
    # backends which not supported it (such as using minio for `s3` storage type), please disable
    # it. To disable redirects, simply set `disableredirect` to `true` instead.
    # Refer to
    # https://github.com/distribution/distribution/blob/release/2.8/docs/configuration.md#redirect
    # for the detail.
    disableredirect: false
    # Specify the "caBundleSecretName" if the storage service uses a self-signed certificate.
    # The secret must contain keys named "ca.crt" which will be injected into the trust store
    # of registry's containers.
    # caBundleSecretName:

    # Specify the type of storage: "filesystem", "azure", "gcs", "s3", "swift",
    # "oss" and fill the information needed in the corresponding section. The type
    # must be "filesystem" if you want to use persistent volumes for registry
    type: filesystem
    filesystem:
      rootdirectory: /storage

# admin 으로 로그인한후 암호를 변경해야지 변경된다.
existingSecretAdminPassword: ""
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
harborAdminPassword: "Harbor12345"

# Run the migration job via helm hook
enableMigrateHelmHook: false

# argocd 는 helm template 으로 렌더링해서 chart 의 lookup(기존 secret 재사용)이 동작하지 않는다.
# chart 가 secret 을 만들게 두면 렌더링마다 랜덤 값이 생성돼 항상 OutOfSync 가 되고,
# selfHeal 이 secret 을 계속 바꾸면서 core/jobservice/registry pod 가 재시작된다.
# 그래서 랜덤 생성되는 값은 git 에 두지 않고, 클러스터에 수동으로 만든 harbor-secrets 하나를 참조한다(README-ysoftman.md 참고).
core:
  # key: secret
  existingSecret: harbor-secrets
  # key: CSRF_KEY
  existingXsrfSecret: harbor-secrets
  # key: tls.key, tls.crt (token 서명용)
  secretName: harbor-secrets

jobservice:
  # key: JOBSERVICE_SECRET
  existingSecret: harbor-secrets

registry:
  # key: REGISTRY_HTTP_SECRET
  existingSecret: harbor-secrets
  credentials:
    # key: REGISTRY_PASSWD, REGISTRY_HTPASSWD (htpasswd 사용자는 기본값 harbor_registry_user)
    existingSecret: harbor-secrets
