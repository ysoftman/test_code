# grafana-community/loki chart 용 커스텀 values
# chart 는 argocd multi-source 로 upstream(https://grafana-community.github.io/helm-charts) 에서 받는다.
# 테스트용 단일 인스턴스(Monolithic) + filesystem 저장소 구성이다.

deploymentMode: Monolithic

loki:
  # 테스트용이라 멀티테넌시(X-Scope-OrgID)를 끈다.
  auth_enabled: false
  commonConfig:
    # 단일 인스턴스라 복제 1
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  # chart 기본값 0 이라 1 로 올려야 파드가 뜬다.
  replicas: 1
  persistence:
    size: 2Gi

# Monolithic 모드에서는 SimpleScalable 타깃(기본 replicas 3)을 모두 0 으로 내려야 chart 검증을 통과한다.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# 테스트용이라 불필요한 구성요소는 끈다(memcached cache 는 메모리를 많이 쓴다).
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
