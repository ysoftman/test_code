# grafana-community/grafana chart 용 커스텀 values
# chart 는 argocd multi-source 로 upstream(https://grafana-community.github.io/helm-charts) 에서 받는다.

# admin 비밀번호를 지정하지 않으면 chart 가 렌더링마다 랜덤 값을 만들어 argocd 에서 항상 OutOfSync 가 된다.
# 테스트 클러스터라 다른 admin 들과 같은 값(ysoftman)을 고정한다. chart 가 이 값으로 secret 을 직접 만든다.
adminUser: admin
adminPassword: ysoftman

# prometheus 앱(namespace: prometheus)의 server service 를 기본 datasource 로 등록
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.prometheus.svc.cluster.local
        # 대시보드가 datasource 를 uid 로 참조하므로 고정한다.
        uid: prometheus
        isDefault: true
      # loki 앱(namespace: loki)의 service. vector 가 보낸 컨테이너 로그를 Explore/대시보드에서 조회한다.
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.loki.svc.cluster.local:3100
        uid: loki

ingress:
  enabled: true
  # colima k3s 기본 내장 traefik ingress controller 사용
  ingressClassName: traefik
  hosts:
    - grafana.ysoftman
  path: /
  pathType: Prefix

# rate() 윈도우는 prometheus scrape_interval(1m)의 4배 이상(5m)이어야 샘플이 2개 이상 잡혀 값이 나온다.
# 대시보드를 파일 provider 로 등록하고 아래 dashboards 의 json 을 /var/lib/grafana/dashboards/default 에 둔다.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    # vector -> prometheus 파이프라인 확인용 대시보드
    vector-pipeline:
      json: |
        {
          "uid": "vector-pipeline",
          "title": "Vector Pipeline",
          "tags": [
            "vector"
          ],
          "timezone": "browser",
          "schemaVersion": 39,
          "version": 3,
          "refresh": "30s",
          "time": {
            "from": "now-1h",
            "to": "now"
          },
          "editable": true,
          "panels": [
            {
              "id": 1,
              "type": "timeseries",
              "title": "Log lines/sec by level",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 0
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (level) (rate(ysoftman_log_lines_total[5m]))",
                  "legendFormat": "{{level}}"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "ops"
                },
                "overrides": []
              }
            },
            {
              "id": 2,
              "type": "timeseries",
              "title": "Log lines/sec by namespace",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 0
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (namespace) (rate(ysoftman_log_lines_total[5m]))",
                  "legendFormat": "{{namespace}}"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "ops"
                },
                "overrides": []
              }
            },
            {
              "id": 3,
              "type": "timeseries",
              "title": "Top 10 pods by log lines/sec",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 8
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "topk(10, sum by (pod) (rate(ysoftman_log_lines_total[5m])))",
                  "legendFormat": "{{pod}}"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "ops"
                },
                "overrides": []
              }
            },
            {
              "id": 4,
              "type": "timeseries",
              "title": "Vector events received/sec by component",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 8
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (component_id) (rate(vector_component_received_events_total[5m]))",
                  "legendFormat": "{{component_id}}"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "ops"
                },
                "overrides": []
              }
            },
            {
              "id": 6,
              "type": "timeseries",
              "title": "Log volume by level (loki)",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 16
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "queryType": "range",
                  "legendFormat": "{{detected_level}}",
                  "expr": "sum by (detected_level) (count_over_time({namespace=~\"$namespace\"}[$__auto]))"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "custom": {
                    "drawStyle": "bars",
                    "fillOpacity": 60,
                    "stacking": {
                      "mode": "normal"
                    }
                  }
                },
                "overrides": [
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "error"
                    },
                    "properties": [
                      {
                        "id": "color",
                        "value": {
                          "mode": "fixed",
                          "fixedColor": "red"
                        }
                      }
                    ]
                  },
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "warn"
                    },
                    "properties": [
                      {
                        "id": "color",
                        "value": {
                          "mode": "fixed",
                          "fixedColor": "orange"
                        }
                      }
                    ]
                  }
                ]
              }
            },
            {
              "id": 7,
              "type": "timeseries",
              "title": "Error logs by pod (loki)",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 16
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "queryType": "range",
                  "legendFormat": "{{pod}}",
                  "expr": "sum by (pod) (count_over_time({namespace=~\"$namespace\"} | detected_level=~\"(?i)error|err|fatal|critical|panic\" [$__auto]))"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "custom": {
                    "drawStyle": "bars",
                    "fillOpacity": 60,
                    "stacking": {
                      "mode": "normal"
                    }
                  }
                },
                "overrides": []
              }
            },
            {
              "id": 8,
              "type": "logs",
              "title": "Error logs only (loki)",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "gridPos": {
                "h": 10,
                "w": 24,
                "x": 0,
                "y": 24
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "queryType": "range",
                  "maxLines": 200,
                  "expr": "{namespace=~\"$namespace\"} | detected_level=~\"(?i)error|err|fatal|critical|panic\" |~ \"(?i)$search\""
                }
              ],
              "options": {
                "showTime": true,
                "wrapLogMessage": true,
                "sortOrder": "Descending",
                "enableLogDetails": true
              }
            },
            {
              "id": 5,
              "type": "logs",
              "title": "All container logs (loki)",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "gridPos": {
                "h": 12,
                "w": 24,
                "x": 0,
                "y": 34
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "expr": "{namespace=~\"$namespace\"} |~ \"(?i)$search\"",
                  "queryType": "range",
                  "maxLines": 200
                }
              ],
              "options": {
                "showTime": true,
                "wrapLogMessage": true,
                "sortOrder": "Descending",
                "enableLogDetails": true
              }
            }
          ],
          "templating": {
            "list": [
              {
                "name": "namespace",
                "label": "namespace",
                "type": "query",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "query": {
                  "label": "namespace",
                  "refId": "ns",
                  "stream": "",
                  "type": 1
                },
                "definition": "label_values(namespace)",
                "refresh": 2,
                "multi": true,
                "includeAll": true,
                "allValue": ".+",
                "current": {
                  "selected": true,
                  "text": "All",
                  "value": "$__all"
                },
                "sort": 1
              },
              {
                "name": "search",
                "label": "search (regex)",
                "type": "textbox",
                "query": "",
                "current": {
                  "text": "",
                  "value": ""
                }
              }
            ]
          }
        }
