# grafana-community/grafana chart 용 커스텀 values
# chart 는 argocd multi-source 로 upstream(https://grafana-community.github.io/helm-charts) 에서 받는다.

# admin 비밀번호를 지정하지 않으면 chart 가 렌더링마다 랜덤 값을 만들어 argocd 에서 항상 OutOfSync 가 된다.
# 테스트 클러스터라 다른 admin 들과 같은 값(ysoftman)을 고정한다. chart 가 이 값으로 secret 을 직접 만든다.
adminUser: admin
adminPassword: ysoftman

# prometheus 앱(namespace: prometheus)의 server service 를 기본 datasource 로 등록
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.prometheus.svc.cluster.local
        # 대시보드가 datasource 를 uid 로 참조하므로 고정한다.
        uid: prometheus
        isDefault: true
      # loki 앱(namespace: loki)의 service. vector 가 보낸 컨테이너 로그를 Explore/대시보드에서 조회한다.
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.loki.svc.cluster.local:3100
        uid: loki

ingress:
  enabled: true
  # colima k3s 기본 내장 traefik ingress controller 사용
  ingressClassName: traefik
  hosts:
    - grafana.ysoftman
  path: /
  pathType: Prefix

# 대시보드를 파일 provider 로 등록한다. 대시보드 json 은 dashboard-*.yaml 파일(dashboards 키)에 있고,
# argocd-apps 의 grafana.valueFiles 로 함께 전달되어 /var/lib/grafana/dashboards/default 에 놓인다.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
