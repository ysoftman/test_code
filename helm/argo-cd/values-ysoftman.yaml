global:
  env:
    - name: ysoftman_key1
      value: ysoftman_value1

configs:
  cm:
    # https://docs.cilium.io/en/latest/configuration/argocd-issues/
    resource.exclusions: |
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
        clusters:
          - "*"
    admin.enabled: true

  # navy 테마 적용 (https://github.com/ysoftman/argocd-themes fix/dark-theme-support 브랜치의 themes/navy.css)
  # chart 가 이 CSS 를 argocd-custom-styles ConfigMap 으로 만들고 ui.cssurl 설정까지 자동 처리한다.
  styles: |
    .sidebar {
        background: #05203c !important
    }

    .nav-bar {
        background: #05203c !important
    }

    .page__content-wrapper:not(.theme-dark *) {
        background: #f2eee8 !important
    }

    .sliding-panel__header:not(.theme-dark *) {
        background: #f2eee8 !important
    }

    .sliding-panel__body:not(.theme-dark *) {
        background: #f2eee8 !important
    }

    .argo-button--base {
        color: #FFFFFF !important;
        background: #0f6bcb !important
    }

    .argo-button--base:hover {
        opacity: 0.8 !important
    }

    .argo-button--base:focus {
        border-color: #FFFFFF !important
    }

    .argo-button--base-o {
        color: #0f6bcb !important;
        box-shadow: inset 0 0 0 1px #0f6bcb !important
    }

    .argo-button--base-o:hover {
        color: #fff !important;
        background-color: #0f6bcb !important
    }

    .argo-button--base-o:focus {
        color: #fff !important;
        background-color: #0f6bcb !important
    }

    .top-bar__title {
        color: #0f6bcb !important
    }

    a {
        color: #0f6bcb !important
    }

    .settings-overview__redirect-panel__title {
        color: #0f6bcb !important
    }

    .selected {
        color: #0f6bcb !important
    }

    .tabs__indicator {
        background: #0f6bcb !important
    }

  params:
    # -- Run server without TLS
    server.insecure: true

  secret:
    # argocdServerAdminPassword 생성
    # argocd account bcrypt --password ysoftman | pbcopy
    # 또는
    # htpasswd -nbBC 10 "" ysoftman | tr -d ':\n' | sed 's/$2y/$2a/' | pbcopy
    argocdServerAdminPassword: "$2a$10$r8DxaN.yw3Sf4OCN.Im9sOkmaYPOShM79Wy9HCjfZLdhlzjCBKhAq"

server:
  ingress:
    enabled: true
    # colima k3s 기본 내장 traefik ingress controller 사용
    # (nginx 의 rewrite-target annotation 은 traefik 미지원이며 root path 라 불필요)
    ingressClassName: "traefik"
    hostname: argocd.ysoftman
    extraTls:
      - hosts:
          - argocd.ysoftman

# redis image override 제거 (chart 10.x 부터 기본값이 ecr-public.aws.com/docker/library/redis 로 변경됐고,
# 기본 tag 8.2.3-alpine 은 다시 오픈소스(AGPL) 라이선스라 pin 이 불필요해짐)
