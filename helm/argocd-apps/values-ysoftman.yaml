common:
  project: default
  server: https://kubernetes.default.svc
  # multi-source app 의 values 파일 저장소 ($values). 브랜치는 앱별 valuesRevision 으로 지정한다.
  valuesRepo:
    repoURL: https://github.com/ysoftman/test_code

nginx:
  enabled: true
  name: nginx
  # chart 는 upstream(bitnami OCI registry) 에서 받고, values 파일만 git 에서 $values ref 로 읽는다.
  # OCI 라도 repoURL 에 oci:// 를 붙이지 않는다(붙이면 argocd 가 manifest 조회시 401 로 실패).
  source:
    repoURL: registry-1.docker.io/bitnamicharts
    chart: nginx
    targetRevision: 25.2.5
  valueFiles:
    - $values/helm/nginx/values-ysoftman.yaml
  # values 파일을 읽을 git 브랜치. 임시로 다른 브랜치를 보려면 argocd UI 의 argocd-apps > Details > Parameters 에서
  # nginx.valuesRevision 을 바꾼다(argocd-apps 는 git 관리 대상이 아니라 override 가 유지된다).
  valuesRevision: HEAD
  values:
    test1: test1

harbor:
  enabled: true
  name: harbor
  # git 에는 vendored chart 원본이 없으므로 chart 는 upstream helm repo 에서 받고,
  # values 파일만 git(common.valuesRepo) 에서 $values ref 로 읽는다.
  source:
    repoURL: https://helm.goharbor.io
    chart: harbor
    targetRevision: 1.18.1
  valueFiles:
    - $values/helm/harbor/values-ysoftman.yaml
  # values 파일을 읽을 git 브랜치. 임시로 다른 브랜치를 보려면 argocd UI 의 argocd-apps > Details > Parameters 에서
  # harbor.valuesRevision 을 바꾼다(argocd-apps 는 git 관리 대상이 아니라 override 가 유지된다).
  valuesRevision: HEAD
  values:
    test1: test1

vector:
  enabled: true
  name: vector
  # git 에는 vendored chart 원본이 없으므로 chart 는 upstream helm repo 에서 받고,
  # values 파일만 git(common.valuesRepo) 에서 $values ref 로 읽는다.
  source:
    repoURL: https://helm.vector.dev
    chart: vector
    targetRevision: 0.59.0
  valueFiles:
    - $values/helm/vector/values-ysoftman.yaml
  # values 파일을 읽을 git 브랜치. 임시로 다른 브랜치를 보려면 argocd UI 의 argocd-apps > Details > Parameters 에서
  # vector.valuesRevision 을 바꾼다(argocd-apps 는 git 관리 대상이 아니라 override 가 유지된다).
  valuesRevision: HEAD
  values:
    test1: test1

tekton:
  enabled: true
  name: tekton
  # chart 가 리소스를 tekton-pipelines namespace 에 고정으로 설치하므로 destination 도 맞춘다.
  namespace: tekton-pipelines
  # git 에는 vendored chart 원본이 없으므로 chart 는 upstream helm repo 에서 받고,
  # values 파일만 git(common.valuesRepo) 에서 $values ref 로 읽는다.
  source:
    repoURL: https://cdfoundation.github.io/tekton-helm-chart
    chart: tekton-pipeline
    targetRevision: 1.15.3
  valueFiles:
    - $values/helm/tekton/values-ysoftman.yaml
  # values 파일을 읽을 git 브랜치. 임시로 다른 브랜치를 보려면 argocd UI 의 argocd-apps > Details > Parameters 에서
  # tekton.valuesRevision 을 바꾼다(argocd-apps 는 git 관리 대상이 아니라 override 가 유지된다).
  valuesRevision: HEAD
  values:
    test1: test1

tekton-dashboard:
  enabled: true
  name: tekton-dashboard
  # release yaml 이 리소스를 tekton-pipelines namespace 에 고정으로 설치하므로 destination 도 맞춘다.
  namespace: tekton-pipelines
  # 공식 helm chart 가 없어 git(common.valuesRepo) 의 kustomization 을 배포한다.
  # dashboard 버전은 helm/tekton-dashboard/kustomization.yaml 의 release url 에서 관리한다.
  source:
    path: helm/tekton-dashboard
    # 임시로 다른 브랜치를 보려면 argocd UI 의 argocd-apps > Details > Parameters 에서
    # tekton-dashboard.source.targetRevision 을 바꾼다.
    targetRevision: HEAD
