{{- if eq (index .Values "tikv" "enabled") true }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ index .Values "tikv" "name" }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: {{ .Values.common.server }}
    namespace: {{ index .Values "tikv" "name" }}
  project: {{ .Values.common.project }}
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # tidb-operator CRD 는 client-side apply 의 last-applied annotation 크기 제한(262144 bytes)을 넘는다.
      - ServerSideApply=true
  # multi-source: 차트와 values 를 서로 다른 저장소에서 가져온다.
  sources:
    # 1) 차트: upstream helm repo 에서 버전 고정으로 받음 (operator 만 설치된다)
    - repoURL: {{ index .Values "tikv" "source" "repoURL" }}
      chart: {{ index .Values "tikv" "source" "chart" }}
      targetRevision: {{ index .Values "tikv" "source" "targetRevision" }}
      helm:
        releaseName: {{ index .Values "tikv" "name" }}
        # ↓ 2) 의 git 저장소에 있는 values 파일을 $values 로 참조
        valueFiles: {{ index .Values "tikv" "valueFiles" }}
        values: |
          {{ toYaml (index .Values "tikv" "values") | nindent 10 }}
    # 2) values: 내 git 저장소. ref 이름(values)으로 위에서 $values 로 가리킴
    #    path 도 같이 지정해서 그 경로의 kustomization(CRD + TidbCluster)도 manifest 로 배포한다.
    - repoURL: {{ .Values.common.valuesRepo.repoURL }}
      targetRevision: {{ index .Values "tikv" "valuesRevision" }}
      ref: values
      path: {{ index .Values "tikv" "path" }}
{{- end }}
