# bitnami/nginx chart 용 커스텀 values
# chart 는 argocd multi-source 로 upstream(registry-1.docker.io/bitnamicharts) 에서 받는다.

# 기본값 tls.autoGenerated 는 렌더링마다 self-signed 인증서를 새로 만들어 argocd 에서 항상 OutOfSync 가 된다.
# TLS 는 ingress(traefik) 에서 처리하므로 nginx 자체 TLS 는 끈다.
tls:
  enabled: false

service:
  # 기본값 LoadBalancer 는 k3s svclb 가 80/443 hostPort 를 잡아 traefik 과 충돌하므로 ClusterIP 사용
  type: ClusterIP

ingress:
  enabled: true
  # colima k3s 기본 내장 traefik ingress controller 사용
  ingressClassName: traefik
  hostname: nginx.ysoftman
  path: /
  pathType: ImplementationSpecific
