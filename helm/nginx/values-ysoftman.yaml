# CloudPirates nginx chart 용 커스텀 values
# chart 는 argocd multi-source 로 upstream(registry-1.docker.io/cloudpirates) 에서 받는다.
# chart 기본값이 http(80) 만 열고 service 도 ClusterIP 라 TLS/service 설정은 필요 없다.

ingress:
  enabled: true
  # colima k3s 기본 내장 traefik ingress controller 사용
  className: traefik
  hosts:
    - host: nginx.ysoftman
      paths:
        - path: /
          pathType: ImplementationSpecific
