[project]
name = "diffuers"
version = "0.1.0"
description = "Load and generate images with Alpha-VLLM/Lumina-Image-2.0 using Hugging Face Diffusers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "accelerate>=1.15",
  "diffusers>=0.40",
  "sentencepiece>=0.2",
  "torch>=2.14",
  "transformers>=5.17",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
